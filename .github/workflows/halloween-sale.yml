name: Halloween sale auto teardown (24-31 Oct 2026)

on:
  schedule:
    # Oct 31 20:05 UTC = Nov 1 00:05 GST (UTC+4). GitHub silently skipped the first
    # scheduled firing of a freshly-pushed workflow during the Aug 2026 Back to School
    # sale, so retry every 15 min for two hours. Disabling is idempotent and the commit
    # step is a no-op when nothing changed, so every firing after the first does nothing.
    - cron: '5,20,35,50 20,21 31 10 *'
  workflow_dispatch:        # manual run from GitHub Actions UI
    inputs:
      mode:
        description: 'enable or disable the sale'
        required: true
        type: choice
        options:
          - disable
          - enable

permissions:
  contents: write

jobs:
  toggle-sale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toggle Halloween sale in theme JSON
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 .github/scripts/toggle_halloween_sale.py ${{ inputs.mode }} --force
          else
            python3 .github/scripts/toggle_halloween_sale.py disable
          fi

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add config/settings_data.json templates/index.json
          git diff --cached --quiet || git commit -m "Auto: toggle Halloween sale (24-31 Oct) [skip ci]"
          git push

  # The live theme is published from staging-main, so tear the sale down there too. Scheduled
  # workflows only run from the default branch (main), hence the second checkout.
  toggle-sale-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          ref: staging-main
          path: live

      - name: Toggle Halloween sale on the live theme (staging-main)
        working-directory: live
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 ../tools/.github/scripts/toggle_halloween_live.py ${{ inputs.mode }} --force
          else
            python3 ../tools/.github/scripts/toggle_halloween_live.py disable
          fi

      - name: Commit and push to staging-main
        working-directory: live
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add config/settings_data.json templates/index.json
          git diff --cached --quiet || git commit -m "Auto: toggle Halloween sale on the live theme (24-31 Oct) [skip ci]"
          git push
